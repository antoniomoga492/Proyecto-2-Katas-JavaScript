<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js" defer></script>
  <title>DOM - Ejercicio 5 - Álbumes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #f5f5f5;
      min-height: 100vh;
      padding: 40px 20px;
    }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2rem; letter-spacing: 2px; text-transform: uppercase; }
    header p { color: #999; margin-top: 8px; }
    .album-list {
      list-style: none;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .album-list li {
      background: #1e1e1e;
      border-left: 4px solid #e63946;
      padding: 18px 22px;
      border-radius: 6px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s, background 0.15s;
    }
    .album-list li:hover { transform: translateX(6px); background: #2a2a2a; }
    .album-number { color: #e63946; font-weight: bold; font-size: 1.3rem; min-width: 32px; }
  </style>
</head>
<body>
</body>
</html>
